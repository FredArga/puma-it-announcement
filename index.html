<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Pengumuman Hasil Seleksi PUMA IT 2026</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <section class="hero">

      <div class="logo">
        PUMA <span>IT</span>
      </div>

      <p class="eyebrow">
        PRESIDENT UNIVERSITY MAJOR ASSOCIATION
      </p>

      <h1>
        Pengumuman Hasil<br>
        <span>Seleksi PUMA IT</span>
      </h1>

      <p class="subtitle">
        Tahun 2026
      </p>

      <div class="search-card">

        <label for="searchInput">
          Masukkan Nama Lengkap
        </label>

        <div class="input-wrap">

          <input
            id="searchInput"
            type="text"
            placeholder="Masukkan nama lengkap"
            autocomplete="off"
          >

          <button id="searchBtn">
            Cek Hasil
          </button>

        </div>

        <p class="hint">
          Masukkan nama sesuai dengan data pendaftaran.
        </p>

        <p id="error" class="error"></p>

      </div>

    </section>


    <section
      id="resultSection"
      class="result-section hidden"
    >

      <div
        id="resultCard"
        class="result-card"
      ></div>

    </section>


    <footer>

      <p>
        © 2026 PUMA IT — President University
      </p>

    </footer>

  </main>


  <script src="script.js"></script>

</body>

</html>
